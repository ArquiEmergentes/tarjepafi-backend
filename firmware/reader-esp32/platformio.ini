; Optional PlatformIO build of the same flat files wokwi.com uses (plan section 6: keep the folder flat).
[platformio]
src_dir = .
default_envs = reader-esp32

[env:reader-esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/> -<.git/>
lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  256dpi/MQTT@^2.5.2
  bblanchon/ArduinoJson@^7.2.1
