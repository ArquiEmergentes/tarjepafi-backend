name: ci

# Pull requests to develop: build and test.
# Pushes to develop and main: build, test, publish the images to GitHub Container Registry.
# Pushes to develop also deploy to Azure App Service, but only when the repository variable AZURE_WEBAPP_NAME is set
# (see docs/DEPLOYMENT.md), so this workflow works before any Azure resource exists.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers starts PostgreSQL and RabbitMQ on the runner's Docker.
      - run: mvn -B verify

  images:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Image names (registry paths must be lower case)
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/tarjepafi-backend" >> "$GITHUB_OUTPUT"
          echo "rabbitmq=ghcr.io/${owner}/tarjepafi-rabbitmq" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: RabbitMQ image (broker configuration baked in)
        uses: docker/build-push-action@v6
        with:
          context: docker/rabbitmq
          push: true
          tags: |
            ${{ steps.names.outputs.rabbitmq }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.rabbitmq }}:${{ steps.names.outputs.branch }}

  deploy:
    needs: images
    if: github.ref == 'refs/heads/develop' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.images.outputs.backend-image }}
