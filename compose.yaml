# Local infrastructure for the backend: PostgreSQL, RabbitMQ (AMQP for the backend, MQTT for readers) and a mail catcher.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tarjepafi
      POSTGRES_USER: ${DB_USERNAME:-tarjepafi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tarjepafi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-tarjepafi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tarjepafi}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MQTT_PORT:-1883}:1883"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-tarjepafi.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Catches the e-mails of the backend (reservations released after 10 minutes). SMTP on 1025, inbox at http://localhost:8025.
  # Start the backend with SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025 to send to it.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  rabbitmq-data:
