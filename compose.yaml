# Local infrastructure for the backend: PostgreSQL and RabbitMQ (AMQP for the backend, MQTT for readers).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tarjepafi
      POSTGRES_USER: ${DB_USERNAME:-tarjepafi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tarjepafi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-tarjepafi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tarjepafi}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MQTT_PORT:-1883}:1883"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-tarjepafi.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
