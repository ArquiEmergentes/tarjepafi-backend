# Readers connect over MQTT. Their topics are published to this topic exchange, so the MQTT topic
# tarjepafi/readers/RDR-A-301/tap arrives with routing key tarjepafi.readers.RDR-A-301.tap.
# The backend declares the exchange on startup; start the backend before the first reader connects.
mqtt.exchange = tarjepafi.devices
mqtt.allow_anonymous = false
mqtt.listeners.tcp.default = 1883
